[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A native Windows network speed widget, built entirely in Rust"
default-run = "tessera"

[build-dependencies]
embed-resource = "3"
usvg = { version = "0.48.1", default-features = false }

[dependencies]
tessera-core = { path = "../tessera-core" }

[dev-dependencies]
tempfile.workspace = true
resvg = { version = "0.48.1", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
windows-numerics = "0.3.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
