[workspace]
members = ["crates/tessera-core", "crates/tessera"]
default-members = ["crates/tessera"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
codegen-units = 16
lto = "thin"
strip = true
panic = "abort"
